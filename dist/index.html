<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QDVC Research Pipeline</title>
<style>
/* ===== 01-base.css ===== */
:root {
  --ink: #1a1d24;
  --ink-soft: #4a4f5a;
  --ink-faint: #8b8f99;
  --paper: #faf8f3;
  --panel: #ffffff;
  --teal: #1f5a5e;
  --teal-dark: #163f42;
  --teal-tint: #e6efee;
  --amber: #b5852a;
  --amber-tint: #f6edd6;
  --rule: #d9d4c7;
  --rule-soft: #e9e5da;
  --danger: #a3352b;
  --danger-tint: #f4e3e0;

  /* status palette */
  --st-onhold: #8b8f99;
  --st-withme: #1f5a5e;
  --st-coauthor: #b5852a;
  --st-review: #6b4d8a;
  --st-published: #2f7d4f;

  /* timeline review-cycle palette */
  --review-c:  #6b4d8a;  /* under review */
  --review-c2: #8064a5;
  --authors-c: #c47f2a;  /* with authors (revising) */
  --authors-c2:#d99a4e;
  --neutral-c: #b7bcc4;  /* ongoing, non-review */

  --serif: Charter, "Iowan Old Style", Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "SF Mono", "JetBrains Mono", "Fira Mono", ui-monospace, Menlo, Consolas, monospace;

  --shadow: 0 1px 2px rgba(26,29,36,.06), 0 4px 16px rgba(26,29,36,.05);
  --radius: 6px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  font-family: var(--sans);
  color: var(--ink);
  background: var(--paper);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { font-family: var(--serif); font-weight: 600; }

button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

:focus-visible {
  outline: 2px solid var(--teal);
  outline-offset: 2px;
  border-radius: 3px;
}

.app {
  display: grid;
  grid-template-columns: 232px 1fr;
  min-height: 100vh;
}

/* ---------- Left rail ---------- */
.rail {
  background: var(--ink);
  color: var(--paper);
  padding: 22px 18px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  position: sticky;
  top: 0;
  height: 100vh;
}

.brand { margin-bottom: 26px; }
.brand .mark {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: .16em;
  color: var(--amber);
}
.brand .name {
  font-family: var(--serif);
  font-size: 20px;
  line-height: 1.2;
  margin-top: 4px;
  color: var(--paper);
}
.brand .sub { font-size: 12px; color: var(--ink-faint); margin-top: 4px; }

.nav-item {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 9px 12px;
  border-radius: var(--radius);
  background: none;
  border: none;
  color: #c9cdd6;
  cursor: pointer;
  text-align: left;
  width: 100%;
  transition: background .12s, color .12s;
}
.nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav-item.active { background: var(--teal); color: #fff; }
.nav-item .k {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--amber);
  min-width: 14px;
}
.nav-item.active .k { color: #fff; }

.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
.rail-foot .count {
  font-size: 12px;
  color: var(--ink-faint);
  padding: 0 12px 4px;
}
.rail-btn {
  display: block;
  width: 100%;
  text-align: left;
  padding: 8px 12px;
  border: none;
  border-radius: var(--radius);
  background: none;
  color: #c9cdd6;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background .12s, color .12s;
}
.rail-btn:hover { background: rgba(255,255,255,.08); color: #fff; }
.rail-btn:active { background: rgba(255,255,255,.12); }

/* ---------- Main ---------- */
.main { padding: 0; overflow: hidden; }
.view { padding: 28px 34px 60px; }
.view[hidden] { display: none; }

.view-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 22px;
  border-bottom: 1px solid var(--rule);
  padding-bottom: 16px;
}
.view-head h1 { margin: 0; font-size: 26px; }
.view-head p { margin: 4px 0 0; color: var(--ink-soft); font-size: 13px; }
.view-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ===== 02-components.css ===== */
/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--rule);
  background: var(--panel);
  color: var(--ink);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: background .12s, border-color .12s, transform .05s;
}
.btn:hover { border-color: var(--ink-faint); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn-primary:hover { background: var(--teal-dark); border-color: var(--teal-dark); }
.btn-danger { color: var(--danger); border-color: var(--danger-tint); background: var(--danger-tint); }
.btn-danger:hover { border-color: var(--danger); }
.btn-ghost { background: none; border-color: transparent; }
.btn-ghost:hover { background: var(--rule-soft); }
.btn-sm { padding: 5px 9px; font-size: 12px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.field label { font-size: 12px; font-weight: 600; color: var(--ink-soft); }
.field .hint { font-size: 11px; color: var(--ink-faint); font-weight: 400; }
input[type=text], input[type=date], input[type=number], select, textarea {
  padding: 8px 10px;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  background: var(--panel);
  width: 100%;
}
input:focus, select:focus, textarea:focus { border-color: var(--teal); outline: none; }
textarea { resize: vertical; min-height: 60px; }
.field.invalid input, .field.invalid select { border-color: var(--danger); }
.field .error { font-size: 11px; color: var(--danger); min-height: 0; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.row2 .field { margin-bottom: 0; }

/* ---------- ID / badges ---------- */
.pid {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: .04em;
  background: var(--ink);
  color: var(--paper);
  padding: 2px 7px;
  border-radius: 4px;
  white-space: nowrap;
}
.pid.link { background: var(--teal-tint); color: var(--teal-dark); }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 500;
  padding: 2px 9px;
  border-radius: 999px;
  border: 1px solid transparent;
  white-space: nowrap;
}
.badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.st-onhold   { color: var(--st-onhold);   background: #f0f0f1; }
.st-withme   { color: var(--st-withme);   background: var(--teal-tint); }
.st-coauthor { color: var(--amber);       background: var(--amber-tint); }
.st-review   { color: var(--st-review);   background: #efe9f5; }
.st-published{ color: var(--st-published);background: #e4f2ea; }

.route-tag {
  font-size: 11px;
  color: var(--ink-soft);
  text-transform: capitalize;
}

/* ---------- Table ---------- */
.table-wrap {
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
}
table { width: 100%; border-collapse: collapse; }
thead th {
  text-align: left;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .04em;
  color: var(--ink-soft);
  padding: 11px 14px;
  border-bottom: 1px solid var(--rule);
  background: #f7f4ec;
  cursor: pointer;
  user-select: none;
}
thead th .arrow { color: var(--amber); margin-left: 3px; }
tbody td { padding: 12px 14px; border-bottom: 1px solid var(--rule-soft); vertical-align: top; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: #fbf9f4; }
.cell-title { font-family: var(--serif); font-size: 15px; font-weight: 600; }
.cell-coauthors { color: var(--ink-soft); font-size: 13px; }
.cell-actions { text-align: right; white-space: nowrap; }
.row-toolbar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
.search { flex: 1; min-width: 200px; max-width: 340px; }
.filter-select { min-width: 150px; width: auto; }

/* ---------- Empty ---------- */
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--ink-soft);
  background: var(--panel);
  border: 1px dashed var(--rule);
  border-radius: var(--radius);
}
.empty h3 { margin: 0 0 6px; font-size: 18px; color: var(--ink); }
.empty p { margin: 0 0 16px; font-size: 14px; }

/* ---------- Toast ---------- */
.toast-stack {
  position: fixed;
  bottom: 20px; right: 20px;
  display: flex; flex-direction: column; gap: 8px;
  z-index: 200;
}
.toast {
  background: var(--ink);
  color: var(--paper);
  padding: 11px 15px;
  border-radius: var(--radius);
  font-size: 13px;
  box-shadow: var(--shadow);
  max-width: 320px;
  animation: toast-in .18s ease-out;
}
.toast.err { background: var(--danger); }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ===== 03-views.css ===== */
/* ---------- Modal ---------- */
.modal-scrim {
  position: fixed; inset: 0;
  background: rgba(26,29,36,.42);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 40px 16px;
  overflow-y: auto;
  z-index: 100;
  animation: scrim-in .14s ease-out;
}
@keyframes scrim-in { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--paper);
  border-radius: 10px;
  width: 100%;
  max-width: 720px;
  box-shadow: 0 12px 48px rgba(26,29,36,.28);
  overflow: hidden;
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 24px;
  border-bottom: 1px solid var(--rule);
  background: var(--panel);
}
.modal-head h2 { margin: 0; font-size: 20px; }
.modal-body { padding: 22px 24px; max-height: 64vh; overflow-y: auto; }
.modal-foot {
  display: flex; justify-content: space-between; gap: 10px;
  padding: 16px 24px;
  border-top: 1px solid var(--rule);
  background: var(--panel);
}
.modal-foot .right { display: flex; gap: 10px; }
.close-x { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--ink-faint); line-height: 1; }
.close-x:hover { color: var(--ink); }

.fieldset {
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 16px;
  background: var(--panel);
}
.fieldset > legend {
  font-family: var(--serif);
  font-size: 15px;
  font-weight: 600;
  padding: 0 8px;
}

/* ---------- Events editor ---------- */
.event-row {
  display: grid;
  grid-template-columns: 130px 1fr auto;
  gap: 10px;
  align-items: start;
  padding: 12px;
  border: 1px solid var(--rule-soft);
  border-radius: var(--radius);
  margin-bottom: 10px;
  background: var(--paper);
}
.event-row .detail-line { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.event-row .note-line { grid-column: 1 / -1; }
.event-row .rm { align-self: start; }
.events-empty { font-size: 13px; color: var(--ink-faint); padding: 8px 0 12px; }

/* academic calendar period rows */
.period-row {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr 1.3fr auto;
  gap: 10px;
  align-items: end;
  padding: 12px;
  border: 1px solid var(--rule-soft);
  border-radius: var(--radius);
  margin-bottom: 10px;
  background: var(--paper);
}
.period-row .btn-danger { align-self: end; }
@media (max-width: 720px) {
  .period-row { grid-template-columns: 1fr 1fr; }
}

/* ---------- Kanban ---------- */
.board {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(230px, 1fr);
  gap: 14px;
  overflow-x: auto;
  padding-bottom: 12px;
  align-items: start;
}
.column {
  background: #f4f1e9;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  min-height: 120px;
}
.column.drop-target { outline: 2px dashed var(--teal); outline-offset: -4px; background: var(--teal-tint); }
.column-head {
  padding: 11px 14px;
  border-bottom: 1px solid var(--rule);
  display: flex; align-items: center; justify-content: space-between;
  font-size: 13px; font-weight: 600;
}
.column-head .n { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); }
.column-body { padding: 10px; display: flex; flex-direction: column; gap: 9px; min-height: 40px; }
.card {
  background: var(--panel);
  border: 1px solid var(--rule);
  border-left-width: 3px;
  border-radius: 5px;
  padding: 11px 12px;
  cursor: grab;
  box-shadow: var(--shadow);
}
.card:active { cursor: grabbing; }
.card.dragging { opacity: .4; }
.card .card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 7px; }
.card .card-title { font-family: var(--serif); font-size: 14px; font-weight: 600; line-height: 1.3; }
.card .card-meta { font-size: 12px; color: var(--ink-soft); margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ---------- Timeline ---------- */
.tl-toolbar {
  display: flex; gap: 16px; flex-wrap: wrap; align-items: center;
  margin-bottom: 16px;
  padding: 14px 16px;
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
}
.tl-toolbar .group { display: flex; align-items: center; gap: 8px; }
.tl-toolbar label.inline { font-size: 13px; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; cursor: pointer; }
.tl-paperfilter { position: relative; }
.tl-paperfilter .menu {
  position: absolute; top: calc(100% + 6px); left: 0;
  background: var(--panel); border: 1px solid var(--rule);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 8px; z-index: 30; min-width: 240px; max-height: 300px; overflow-y: auto;
}
.tl-paperfilter .menu label { display: flex; align-items: center; gap: 8px; padding: 5px 6px; font-size: 13px; cursor: pointer; border-radius: 4px; }
.tl-paperfilter .menu label:hover { background: var(--rule-soft); }
.tl-paperfilter .menu .menu-actions { display: flex; gap: 6px; padding: 4px 6px 8px; border-bottom: 1px solid var(--rule-soft); margin-bottom: 6px; }

.tl-canvas {
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  overflow: auto;
  max-height: 70vh;
  box-shadow: var(--shadow);
  position: relative;
}
.tl-inner { position: relative; width: max-content; }

/* header row (sticky to top while scrolling vertically) */
.tl-header {
  display: flex;
  position: sticky; top: 0;
  z-index: 15;
  background: #f7f4ec;
  border-bottom: 1px solid var(--rule);
}
/* the corner is sticky on BOTH axes so panning left never clips it */
.tl-corner {
  position: sticky; left: 0;
  z-index: 16;
  background: #f2eee3;
  border-right: 1px solid var(--rule);
  height: 46px;
  display: flex; align-items: flex-end;
  padding: 0 14px 6px;
  font-family: var(--serif); font-size: 12px; font-weight: 600; color: var(--ink-soft);
}
.tl-axis {
  position: relative;
  height: 46px;
}
.tl-tick { position: absolute; top: 0; height: 24px; border-left: 1px solid var(--rule); }
.tl-tick span.yr { position: absolute; top: 5px; left: 5px; font-size: 11px; font-weight: 700; color: var(--ink-soft); font-family: var(--mono); white-space: nowrap; }
.tl-month { position: absolute; top: 24px; height: 22px; border-left: 1px solid var(--rule-soft); }
.tl-month span { position: absolute; top: 4px; left: 3px; font-size: 9px; color: var(--ink-faint); font-family: var(--mono); }

/* body wraps the shading layer, crosshair, and lanes */
.tl-body { position: relative; }
.tl-shade-layer { position: absolute; top: 0; bottom: 0; z-index: 0; pointer-events: none; }
.tl-shade { position: absolute; top: 0; bottom: 0; }

.tl-crosshair {
  position: absolute; top: 0; bottom: 0; width: 1px;
  background: var(--teal); z-index: 12; pointer-events: none; display: none;
}
.tl-crosshair-date {
  position: absolute; top: 2px; left: 4px;
  background: var(--teal); color: #fff;
  font-size: 10px; font-family: var(--mono); padding: 2px 6px; border-radius: 4px;
  white-space: nowrap;
}

.tl-lanes { position: relative; z-index: 1; }
.tl-lane {
  position: relative;
  border-bottom: 1px solid var(--rule-soft);
  display: flex;
  align-items: stretch;
}
.tl-lane:last-child { border-bottom: none; }
.tl-lane .lane-label {
  width: 220px;
  min-width: 220px;
  padding: 12px 14px;
  border-right: 1px solid var(--rule);
  background: var(--paper);
  position: sticky; left: 0; z-index: 8;
}
.tl-lane .lane-label .lt { font-family: var(--serif); font-size: 14px; font-weight: 600; line-height: 1.25; margin-top: 6px; display: block; }
.tl-lane .lane-track { position: relative; flex: 1; min-height: 62px; }

.tl-seg {
  position: absolute;
  top: 24px;
  height: 16px;
  border-radius: 8px;
  background: var(--teal);
  opacity: .9;
}
/* review-cycle roles */
.tl-seg.role-review  { background: var(--review-c); }
.tl-seg.role-authors { background: var(--authors-c); }
.tl-seg.current { background: repeating-linear-gradient(45deg, var(--neutral-c), var(--neutral-c) 6px, #9aa0aa 6px, #9aa0aa 12px); }
.tl-seg.current.role-review { background: repeating-linear-gradient(45deg, var(--review-c), var(--review-c) 6px, var(--review-c2) 6px, var(--review-c2) 12px); }
.tl-seg.current.role-authors { background: repeating-linear-gradient(45deg, var(--authors-c), var(--authors-c) 6px, var(--authors-c2) 6px, var(--authors-c2) 12px); }
.tl-seg .dur {
  position: absolute; top: -17px; left: 50%; transform: translateX(-50%);
  font-size: 10px; color: var(--ink-soft); font-family: var(--mono); white-space: nowrap;
}
.tl-seg .rlabel {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  font-size: 10px; font-weight: 700; letter-spacing: .03em;
  color: #fff; font-family: var(--mono); white-space: nowrap; pointer-events: none;
}

/* legend */
.tl-legend {
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  padding: 10px 16px; margin-bottom: 14px;
  background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius);
  font-size: 12px; color: var(--ink-soft);
}
.tl-legend .lg { display: inline-flex; align-items: center; gap: 7px; }
.tl-legend .sw { width: 26px; height: 12px; border-radius: 6px; display: inline-block; }
.tl-legend .sw.review  { background: var(--review-c); }
.tl-legend .sw.authors { background: var(--authors-c); }
.tl-legend .sw.current { background: repeating-linear-gradient(45deg, var(--neutral-c), var(--neutral-c) 5px, #9aa0aa 5px, #9aa0aa 10px); }
.tl-legend .sw.other   { background: var(--teal); }
.tl-legend .sw.busy    { background: rgba(163, 53, 43, .32); }
.tl-legend .sw.relaxed { background: rgba(47, 125, 79, .32); }
.tl-legend .lg b { color: var(--ink); font-weight: 600; }

/* event marker nodes — larger, icon-bearing */
.tl-node {
  position: absolute; top: 20px;
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--panel); border: 2px solid var(--ink); color: var(--ink);
  transform: translateX(-50%);
  z-index: 4; cursor: default;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 1px 3px rgba(26,29,36,.18);
}
.tl-node svg { display: block; }
.tl-node.kind-submit   { border-color: var(--teal);     color: var(--teal); }
.tl-node.kind-resubmit { border-color: var(--teal);     color: var(--teal); }
.tl-node.kind-revise   { border-color: var(--amber);    color: var(--amber); }
.tl-node.kind-reject   { border-color: var(--danger);   color: var(--danger); background: var(--danger-tint); }
.tl-node.kind-accept   { border-color: var(--st-published); color: var(--st-published); background: #e4f2ea; }
.tl-node.kind-terminal { border-color: var(--st-published); color: var(--st-published); }
.tl-node .node-tip {
  position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--paper);
  padding: 6px 9px; border-radius: 5px; font-size: 11px; line-height: 1.4;
  white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s;
  z-index: 20;
}
.tl-node:hover { z-index: 21; }
.tl-node:hover .node-tip { opacity: 1; }

<div id="modalHost"></div>
<div class="toast-stack" id="toastStack"></div>
<script>
/* ===== 01-store.js ===== */
/* ============================================================
   QDVC Research Pipeline — data model & store
   ============================================================ */

const STORAGE_KEY = 'qdvc.pipeline.v1';
const SCHEMA = 1;

const STATUSES = [
  { value: 'onhold',   label: 'On hold',        cls: 'st-onhold' },
  { value: 'withme',   label: 'With me',        cls: 'st-withme' },
  { value: 'coauthor', label: 'With a coauthor',cls: 'st-coauthor' },
  { value: 'review',   label: 'Under review',   cls: 'st-review' },
  { value: 'published',label: 'Published',      cls: 'st-published' },
];
const STATUS_MAP = Object.fromEntries(STATUSES.map(s => [s.value, s]));

const ROUTES = [
  { value: 'conference', label: 'Conference' },
  { value: 'journal',    label: 'Journal' },
  { value: 'other',      label: 'Other' },
];

/* Event types per route. `detail` flags a type that carries structured fields. */
const EVENT_TYPES = {
  conference: [
    { value: 'conf_submitted',   label: 'Submitted to conference' },
    { value: 'conf_decision',    label: 'Received decision from conference', detail: 'decision' },
    { value: 'conf_resubmitted', label: 'Resubmitted to conference' },
    { value: 'conf_proceedings', label: 'Included in conference proceedings' },
    { value: 'conf_presented',   label: 'Presented at conference', terminal: true },
  ],
  journal: [
    { value: 'jrn_submitted',    label: 'Submitted to journal' },
    { value: 'jrn_decision',     label: 'Received decision from journal', detail: 'decision' },
    { value: 'jrn_resubmitted',  label: 'Resubmitted to journal' },
    { value: 'jrn_online',       label: 'Published online', terminal: true },
    { value: 'jrn_print',        label: 'Published in print', detail: 'volissue', terminal: true },
  ],
  other: [], // freeform only
};

const DECISIONS = [
  { value: 'reject', label: 'Reject' },
  { value: 'revise', label: 'Revise' },
  { value: 'accept', label: 'Accept' },
];

/* Flat lookup for any event type value -> definition */
const EVENT_TYPE_MAP = {};
Object.values(EVENT_TYPES).flat().forEach(t => { EVENT_TYPE_MAP[t.value] = t; });

function eventTypesForRoute(route) { return EVENT_TYPES[route] || []; }
function eventTypeLabel(v) {
  if (!v) return 'Untagged event';
  return EVENT_TYPE_MAP[v] ? EVENT_TYPE_MAP[v].label : v;
}
function isDecisionType(v) { return EVENT_TYPE_MAP[v] && EVENT_TYPE_MAP[v].detail === 'decision'; }
function isVolIssueType(v) { return EVENT_TYPE_MAP[v] && EVENT_TYPE_MAP[v].detail === 'volissue'; }
function isTerminalType(v) { return !!(EVENT_TYPE_MAP[v] && EVENT_TYPE_MAP[v].terminal); }

/* Review-cycle classification. A submission or resubmission sends the paper into
   review; a decision ends a review round; a resubmission returns it to review
   after the authors revise. */
const SUBMIT_TYPES   = new Set(['conf_submitted', 'conf_resubmitted', 'jrn_submitted', 'jrn_resubmitted']);
const RESUBMIT_TYPES = new Set(['conf_resubmitted', 'jrn_resubmitted']);
function isSubmissionType(v)  { return SUBMIT_TYPES.has(v); }
function isResubmitType(v)    { return RESUBMIT_TYPES.has(v); }
function isDecisionEventType(v) { return isDecisionType(v); }

const ID_RE = /^[0-9]{2}[A-Z]{2}$/;
function isValidId(id) { return ID_RE.test(id || ''); }

/* Academic-calendar workload levels. Negative = more research time (relaxed),
   positive = less (busy). Weights sum additively across overlapping periods. */
const WORKLOADS = [
  { value: -3, label: 'Most relaxed' },
  { value: -2, label: 'More relaxed' },
  { value: -1, label: 'Somewhat relaxed' },
  { value: 0,  label: 'Neutral' },
  { value: 1,  label: 'Busy' },
  { value: 2,  label: 'Busier' },
  { value: 3,  label: 'Busiest' },
];
const WORKLOAD_MAP = Object.fromEntries(WORKLOADS.map(w => [w.value, w]));

/* Timeline sort options. */
const TL_SORTS = [
  { value: 'id_early', label: 'Paper ID (earliest)' },
  { value: 'id_late',  label: 'Paper ID (latest)' },
  { value: 'first_ev', label: 'First event recorded' },
  { value: 'last_ev',  label: 'Last event recorded' },
];

function defaultSettings() {
  return {
    timeline: {
      visibleKeys: null,   // null = all papers with events; else array of _keys
      mergeLinked: false,
      sortBy: 'id_early',
      sortDir: 1,          // 1 asc, -1 desc
    },
  };
}

function uid() { return 'e' + Math.random().toString(36).slice(2, 9); }

/* ---------- Store ---------- */
const Store = {
  papers: [],
  calendar: [],
  settings: defaultSettings(),

  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        this.papers = Array.isArray(data.papers) ? data.papers : [];
        this.calendar = Array.isArray(data.calendar) ? data.calendar : [];
        this.settings = mergeSettings(data.settings);
      } else {
        this.papers = [];
        this.calendar = [];
        this.settings = defaultSettings();
      }
    } catch (e) {
      console.error('Load failed', e);
      this.papers = [];
      this.calendar = [];
      this.settings = defaultSettings();
    }
    this.papers.forEach(normalizePaper);
    this.calendar.forEach(normalizePeriod);
  },

  persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(this.serialize()));
    } catch (e) {
      toast('Could not save to browser storage. Storage may be full.', true);
    }
  },

  serialize() {
    return { schema: SCHEMA, exportedAt: new Date().toISOString(), papers: this.papers, calendar: this.calendar, settings: this.settings };
  },

  get(id) { return this.papers.find(p => p.id === id) || null; },
  getByKey(key) { return this.papers.find(p => p._key === key) || null; },

  idExists(id, exceptKey) {
    return this.papers.some(p => p.id === id && p._key !== exceptKey);
  },

  upsert(paper) {
    normalizePaper(paper);
    const i = this.papers.findIndex(p => p._key === paper._key);
    if (i >= 0) this.papers[i] = paper; else this.papers.push(paper);
    this.persist();
  },

  remove(key) {
    // clear any journal->conference links pointing at the removed paper's id
    const removed = this.papers.find(p => p._key === key);
    this.papers = this.papers.filter(p => p._key !== key);
    if (removed) {
      this.papers.forEach(p => { if (p.derivedFrom === removed.id) p.derivedFrom = ''; });
    }
    this.persist();
  },

  replaceAll(data) {
    // accepts a full export object or a bare papers array (back-compat)
    if (Array.isArray(data)) {
      this.papers = data; this.calendar = []; this.settings = defaultSettings();
    } else {
      this.papers = Array.isArray(data.papers) ? data.papers : [];
      this.calendar = Array.isArray(data.calendar) ? data.calendar : [];
      this.settings = mergeSettings(data.settings);
    }
    this.papers.forEach(normalizePaper);
    this.calendar.forEach(normalizePeriod);
    this.persist();
  },

  /* ----- academic calendar ----- */
  upsertPeriod(period) {
    normalizePeriod(period);
    const i = this.calendar.findIndex(x => x._key === period._key);
    if (i >= 0) this.calendar[i] = period; else this.calendar.push(period);
    this.persist();
  },
  removePeriod(key) {
    this.calendar = this.calendar.filter(x => x._key !== key);
    this.persist();
  },

  /* ----- settings ----- */
  updateTimelineSettings(patch) {
    Object.assign(this.settings.timeline, patch);
    this.persist();
  },
};

function mergeSettings(s) {
  const d = defaultSettings();
  if (s && s.timeline) Object.assign(d.timeline, s.timeline);
  return d;
}

function normalizePeriod(pd) {
  if (!pd._key) pd._key = uid();
  pd.name = pd.name || '';
  pd.start = pd.start || '';
  pd.end = pd.end || '';
  pd.workload = WORKLOAD_MAP[pd.workload] ? pd.workload : (typeof pd.workload === 'number' ? pd.workload : 0);
  return pd;
}

function blankPeriod() {
  return normalizePeriod({ name: '', start: '', end: '', workload: 1 });
}

function normalizePaper(p) {
  if (!p._key) p._key = uid();
  p.id = (p.id || '').toUpperCase();
  p.title = p.title || '';
  p.coauthors = p.coauthors || '';
  p.status = STATUS_MAP[p.status] ? p.status : 'onhold';
  p.route = ROUTES.some(r => r.value === p.route) ? p.route : 'conference';
  p.derivedFrom = p.derivedFrom || '';
  if (!Array.isArray(p.events)) p.events = [];
  p.events.forEach(ev => {
    if (!ev._key) ev._key = uid();
    ev.date = ev.date || '';
    ev.type = ev.type || '';
    ev.decision = ev.decision || '';
    ev.volume = ev.volume || '';
    ev.issue = ev.issue || '';
    ev.note = ev.note || '';
  });
  return p;
}

function blankPaper() {
  return normalizePaper({ id: '', title: '', coauthors: '', status: 'onhold', route: 'conference', derivedFrom: '', events: [] });
}

function newEvent() {
  return { _key: uid(), date: '', type: '', decision: '', volume: '', issue: '', note: '' };
}

/* ===== 02-util.js ===== */
/* ============================================================
   Utilities: DOM, dates, toast, escaping, import/export
   ============================================================ */

const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function el(tag, attrs = {}, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else if (k === 'dataset') Object.assign(node.dataset, v);
    else node.setAttribute(k, v === true ? '' : v);
  }
  kids.flat().forEach(kid => {
    if (kid == null || kid === false) return;
    node.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid);
  });
  return node;
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* ---------- Toast ---------- */
function toast(msg, isErr = false) {
  const stack = $('#toastStack');
  const t = el('div', { class: 'toast' + (isErr ? ' err' : '') }, msg);
  stack.appendChild(t);
  setTimeout(() => {
    t.style.transition = 'opacity .25s';
    t.style.opacity = '0';
    setTimeout(() => t.remove(), 260);
  }, isErr ? 4200 : 2600);
}

/* ---------- Dates ---------- */
function parseDate(s) {
  if (!s) return null;
  const d = new Date(s + 'T00:00:00');
  return isNaN(d) ? null : d;
}
function fmtDate(s) {
  const d = parseDate(s);
  if (!d) return '—';
  return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
}
const DAY = 86400000;
function daysBetween(a, b) { return Math.round((b - a) / DAY); }

/* Human duration: e.g. "3d", "5w", "4mo", "1y 2mo" */
function humanDuration(days) {
  if (days < 0) days = 0;
  if (days === 0) return 'same day';
  if (days < 14) return days + 'd';
  if (days < 60) return Math.round(days / 7) + 'w';
  if (days < 365) return Math.round(days / 30) + 'mo';
  const y = Math.floor(days / 365);
  const mo = Math.round((days % 365) / 30);
  return mo ? `${y}y ${mo}mo` : `${y}y`;
}

function todayISO() { return new Date().toISOString().slice(0, 10); }

/* Sorted (by date, undated last) copy of a paper's events */
function sortedEvents(paper) {
  return paper.events.slice().sort((a, b) => {
    const da = parseDate(a.date), db = parseDate(b.date);
    if (da && db) return da - db;
    if (da) return -1;
    if (db) return 1;
    return 0;
  });
}

/* Dated events only, sorted ascending. */
function datedEvents(paper) {
  return sortedEvents(paper).filter(e => parseDate(e.date));
}
/* A paper counts as having events if it has at least one dated event. */
function hasEvents(paper) { return datedEvents(paper).length > 0; }
/* [firstDate, lastDate] as timestamps, or null if no dated events. */
function eventBounds(paper) {
  const evs = datedEvents(paper);
  if (!evs.length) return null;
  return [+parseDate(evs[0].date), +parseDate(evs[evs.length - 1].date)];
}

/* ---------- Export / Import ---------- */
function exportJSON() {
  const blob = new Blob([JSON.stringify(Store.serialize(), null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: `qdvc-pipeline-${todayISO()}.json` });
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('Exported ' + Store.papers.length + ' paper' + (Store.papers.length === 1 ? '' : 's'));
}

function importJSONText(text) {
  let data;
  try { data = JSON.parse(text); }
  catch { toast('That file is not valid JSON.', true); return; }
  const papers = Array.isArray(data) ? data : data.papers;
  if (!Array.isArray(papers)) { toast('No papers found in that file.', true); return; }
  // fresh keys to avoid collisions with current session
  papers.forEach(p => { p._key = uid(); });
  const calendar = (!Array.isArray(data) && Array.isArray(data.calendar)) ? data.calendar : [];
  calendar.forEach(pd => { pd._key = uid(); });
  const settings = (!Array.isArray(data)) ? data.settings : null;
  // imported visibleKeys referenced the old session's keys; drop them so the
  // timeline defaults to showing all papers that have events.
  if (settings && settings.timeline) settings.timeline.visibleKeys = null;
  Store.replaceAll({ papers, calendar, settings });
  TimelineView.syncFromSettings();
  App.renderAll();
  const cn = calendar.length;
  toast('Imported ' + papers.length + ' paper' + (papers.length === 1 ? '' : 's') + (cn ? ' and ' + cn + ' calendar period' + (cn === 1 ? '' : 's') : ''));
}

function statusBadge(value) {
  const s = STATUS_MAP[value] || STATUS_MAP.onhold;
  return el('span', { class: 'badge ' + s.cls },
    el('span', { class: 'dot' }), s.label);
}

/* ===== 03-table.js ===== */
/* ============================================================
   Table view
   ============================================================ */

const TableView = {
  sortKey: 'id',
  sortDir: 1,
  search: '',
  fStatus: '',
  fRoute: '',

  mount() {
    $('#tableSearch').addEventListener('input', e => { this.search = e.target.value.trim().toLowerCase(); this.render(); });
    const sf = $('#tableStatusFilter');
    STATUSES.forEach(s => sf.appendChild(el('option', { value: s.value }, s.label)));
    sf.addEventListener('change', e => { this.fStatus = e.target.value; this.render(); });
    const rf = $('#tableRouteFilter');
    ROUTES.forEach(r => rf.appendChild(el('option', { value: r.value }, r.label)));
    rf.addEventListener('change', e => { this.fRoute = e.target.value; this.render(); });
  },

  rows() {
    let rows = Store.papers.slice();
    if (this.fStatus) rows = rows.filter(p => p.status === this.fStatus);
    if (this.fRoute) rows = rows.filter(p => p.route === this.fRoute);
    if (this.search) {
      const q = this.search;
      rows = rows.filter(p =>
        p.id.toLowerCase().includes(q) ||
        p.title.toLowerCase().includes(q) ||
        p.coauthors.toLowerCase().includes(q));
    }
    const k = this.sortKey, dir = this.sortDir;
    rows.sort((a, b) => {
      let av, bv;
      if (k === 'events') { av = a.events.length; bv = b.events.length; }
      else if (k === 'status') { av = STATUS_MAP[a.status].label; bv = STATUS_MAP[b.status].label; }
      else { av = (a[k] || '').toString().toLowerCase(); bv = (b[k] || '').toString().toLowerCase(); }
      if (av < bv) return -1 * dir;
      if (av > bv) return 1 * dir;
      return 0;
    });
    return rows;
  },

  render() {
    const host = $('#tableHost');
    host.innerHTML = '';
    const rows = this.rows();

    if (Store.papers.length === 0) {
      host.appendChild(el('div', { class: 'empty' },
        el('h3', {}, 'No papers yet'),
        el('p', {}, 'Track your first research project from ideation through to publication.'),
        el('button', { class: 'btn btn-primary', onclick: () => openPaperModal(null) }, 'New paper')));
      return;
    }
    if (rows.length === 0) {
      host.appendChild(el('div', { class: 'empty' },
        el('h3', {}, 'No matches'),
        el('p', {}, 'No papers match your search or filters.')));
      return;
    }

    const arrow = key => this.sortKey === key ? el('span', { class: 'arrow' }, this.sortDir > 0 ? '▲' : '▼') : '';
    const th = (key, label) => el('th', { onclick: () => this.sort(key) }, label, arrow(key));

    const table = el('table', {},
      el('thead', {}, el('tr', {},
        th('id', 'ID'), th('title', 'Title'), th('coauthors', 'Coauthors'),
        th('status', 'Status'), th('route', 'Route'), th('events', 'Events'),
        el('th', { style: 'text-align:right' }, 'Actions'))),
      el('tbody', {}, ...rows.map(p => this.rowEl(p))));

    host.appendChild(el('div', { class: 'table-wrap' }, table));
  },

  rowEl(p) {
    const route = ROUTES.find(r => r.value === p.route);
    const derived = p.route === 'journal' && p.derivedFrom
      ? el('span', { class: 'pid link', title: 'Developed from ' + p.derivedFrom, style: 'margin-left:6px' }, '↳ ' + p.derivedFrom)
      : null;
    return el('tr', { onclick: e => { if (!e.target.closest('button')) openPaperModal(p._key); }, style: 'cursor:pointer' },
      el('td', {}, el('span', { class: 'pid' }, p.id || '—')),
      el('td', { class: 'cell-title' }, p.title || el('span', { style: 'color:var(--ink-faint);font-family:var(--sans);font-weight:400' }, 'Untitled')),
      el('td', { class: 'cell-coauthors' }, p.coauthors || '—'),
      el('td', {}, statusBadge(p.status)),
      el('td', {}, el('span', { class: 'route-tag' }, route ? route.label : p.route), derived),
      el('td', { style: 'font-family:var(--mono);color:var(--ink-soft)' }, String(p.events.length)),
      el('td', { class: 'cell-actions' },
        el('button', { class: 'btn btn-sm btn-ghost', onclick: () => openPaperModal(p._key) }, 'Edit'),
        el('button', { class: 'btn btn-sm btn-danger', style: 'margin-left:6px', onclick: () => confirmDelete(p) }, 'Delete')));
  },

  sort(key) {
    if (this.sortKey === key) this.sortDir *= -1;
    else { this.sortKey = key; this.sortDir = 1; }
    this.render();
  },
};

function confirmDelete(p) {
  const label = p.title ? `"${p.title}"` : (p.id || 'this paper');
  if (confirm(`Delete ${label}? This cannot be undone.`)) {
    Store.remove(p._key);
    App.renderAll();
    toast('Deleted ' + (p.id || 'paper'));
  }
}

/* ===== 04-modal.js ===== */
/* ============================================================
   Paper create / edit modal
   ============================================================ */

let editing = null; // working copy

function openPaperModal(key) {
  const source = key ? Store.getByKey(key) : null;
  editing = source ? JSON.parse(JSON.stringify(source)) : blankPaper();
  if (!editing._key) editing._key = uid();
  renderModal(!source);
}

function closeModal() {
  editing = null;
  $('#modalHost').innerHTML = '';
  document.removeEventListener('keydown', escClose);
}
function escClose(e) { if (e.key === 'Escape') closeModal(); }

function renderModal(isNew) {
  const host = $('#modalHost');
  host.innerHTML = '';

  const idField = el('div', { class: 'field', id: 'f-id' },
    el('label', {}, 'Paper ID ', el('span', { class: 'hint' }, '— format 00AA (2 digits, 2 capitals)')),
    el('input', { type: 'text', id: 'in-id', value: editing.id, maxlength: '4', placeholder: '26AB',
      style: 'font-family:var(--mono);text-transform:uppercase;max-width:140px',
      oninput: e => { e.target.value = e.target.value.toUpperCase(); editing.id = e.target.value; clearErr('f-id'); } }),
    el('div', { class: 'error', id: 'err-id' }));

  const titleField = el('div', { class: 'field', id: 'f-title' },
    el('label', {}, 'Title'),
    el('input', { type: 'text', id: 'in-title', value: editing.title, placeholder: 'e.g. Videoconferencing fatigue in distributed teams',
      oninput: e => { editing.title = e.target.value; clearErr('f-title'); } }),
    el('div', { class: 'error', id: 'err-title' }));

  const coField = el('div', { class: 'field' },
    el('label', {}, 'Coauthors ', el('span', { class: 'hint' }, '— comma separated')),
    el('input', { type: 'text', value: editing.coauthors, placeholder: 'A. Smith, B. Doe',
      oninput: e => { editing.coauthors = e.target.value; } }));

  const statusSel = el('select', { oninput: e => { editing.status = e.target.value; } },
    ...STATUSES.map(s => el('option', { value: s.value, selected: editing.status === s.value }, s.label)));
  const statusField = el('div', { class: 'field' }, el('label', {}, 'Work status'), statusSel);

  const routeSel = el('select', { id: 'in-route', oninput: e => onRouteChange(e.target.value) },
    ...ROUTES.map(r => el('option', { value: r.value, selected: editing.route === r.value }, r.label)));
  const routeField = el('div', { class: 'field' }, el('label', {}, 'Publication route'), routeSel);

  const derivedHost = el('div', { id: 'derivedHost' });

  const eventsHost = el('div', { id: 'eventsHost' });

  const body = el('div', { class: 'modal-body' },
    el('div', { class: 'row2' }, idField, statusField),
    titleField,
    coField,
    el('div', { class: 'row2' }, routeField, derivedHost),
    el('fieldset', { class: 'fieldset' },
      el('legend', {}, 'Publication events'),
      eventsHost,
      el('button', { class: 'btn btn-sm', type: 'button', onclick: addEventRow }, '+ Add event')));

  const modal = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' },
    el('div', { class: 'modal-head' },
      el('h2', {}, isNew ? 'New paper' : 'Edit paper'),
      el('button', { class: 'close-x', 'aria-label': 'Close', onclick: closeModal }, '×')),
    body,
    el('div', { class: 'modal-foot' },
      el('div', {}, isNew ? '' : el('button', { class: 'btn btn-danger', type: 'button',
        onclick: () => { const p = Store.getByKey(editing._key); closeModal(); if (p) confirmDelete(p); } }, 'Delete')),
      el('div', { class: 'right' },
        el('button', { class: 'btn', type: 'button', onclick: closeModal }, 'Cancel'),
        el('button', { class: 'btn btn-primary', type: 'button', onclick: savePaper }, 'Save paper'))));

  const scrim = el('div', { class: 'modal-scrim', onclick: e => { if (e.target === scrim) closeModal(); } }, modal);
  host.appendChild(scrim);
  document.addEventListener('keydown', escClose);

  renderDerived();
  renderEvents();
  $('#in-id').focus();
}

function onRouteChange(route) {
  editing.route = route;
  // drop event tags that no longer belong to this route (keep the event, untag it)
  const valid = new Set(eventTypesForRoute(route).map(t => t.value));
  editing.events.forEach(ev => { if (ev.type && !valid.has(ev.type)) { ev.type = ''; ev.decision = ''; ev.volume = ''; ev.issue = ''; } });
  if (route !== 'journal') editing.derivedFrom = '';
  renderDerived();
  renderEvents();
}

function renderDerived() {
  const host = $('#derivedHost');
  host.innerHTML = '';
  if (editing.route !== 'journal') { host.appendChild(el('div', { class: 'field' })); return; }
  const candidates = Store.papers.filter(p => p._key !== editing._key && p.route === 'conference' && p.id);
  const sel = el('select', { oninput: e => { editing.derivedFrom = e.target.value; } },
    el('option', { value: '' }, '— none —'),
    ...candidates.map(p => el('option', { value: p.id, selected: editing.derivedFrom === p.id },
      `${p.id} · ${p.title || 'Untitled'}`)));
  // if current value references a paper not in candidates (e.g. missing), still show it
  if (editing.derivedFrom && !candidates.some(p => p.id === editing.derivedFrom)) {
    sel.appendChild(el('option', { value: editing.derivedFrom, selected: true }, editing.derivedFrom + ' (unlinked)'));
  }
  host.appendChild(el('div', { class: 'field' },
    el('label', {}, 'Developed from ', el('span', { class: 'hint' }, '— conference paper')),
    sel));
}

function addEventRow() {
  editing.events.push(newEvent());
  renderEvents();
}

function renderEvents() {
  const host = $('#eventsHost');
  host.innerHTML = '';
  if (editing.events.length === 0) {
    host.appendChild(el('div', { class: 'events-empty' }, 'No events yet. Add submissions, decisions, and milestones to build the timeline.'));
    return;
  }
  editing.events.forEach((ev, i) => host.appendChild(eventRowEl(ev, i)));
}

function eventRowEl(ev, i) {
  const types = eventTypesForRoute(editing.route);
  const typeSel = el('select', { oninput: e => { ev.type = e.target.value; if (!isDecisionType(ev.type)) ev.decision = ''; if (!isVolIssueType(ev.type)) { ev.volume = ''; ev.issue = ''; } renderEvents(); } },
    el('option', { value: '' }, 'Untagged'),
    ...types.map(t => el('option', { value: t.value, selected: ev.type === t.value }, t.label)));

  const dateIn = el('input', { type: 'date', value: ev.date, oninput: e => { ev.date = e.target.value; } });

  const kids = [
    el('div', { class: 'field', style: 'margin:0' }, el('label', {}, 'Date'), dateIn),
    el('div', { class: 'field', style: 'margin:0' }, el('label', {}, 'Type'), typeSel),
    el('button', { class: 'btn btn-sm btn-danger rm', type: 'button', title: 'Remove event',
      onclick: () => { editing.events.splice(i, 1); renderEvents(); } }, 'Remove'),
  ];

  if (isDecisionType(ev.type)) {
    const decSel = el('select', { oninput: e => { ev.decision = e.target.value; } },
      el('option', { value: '' }, '— decision —'),
      ...DECISIONS.map(d => el('option', { value: d.value, selected: ev.decision === d.value }, d.label)));
    kids.push(el('div', { class: 'detail-line' },
      el('div', { class: 'field', style: 'margin:0' }, el('label', {}, 'Decision'), decSel),
      el('div', {})));
  }
  if (isVolIssueType(ev.type)) {
    kids.push(el('div', { class: 'detail-line' },
      el('div', { class: 'field', style: 'margin:0' }, el('label', {}, 'Volume'),
        el('input', { type: 'text', value: ev.volume, placeholder: 'e.g. 12', oninput: e => { ev.volume = e.target.value; } })),
      el('div', { class: 'field', style: 'margin:0' }, el('label', {}, 'Issue'),
        el('input', { type: 'text', value: ev.issue, placeholder: 'e.g. 3', oninput: e => { ev.issue = e.target.value; } }))));
  }
  kids.push(el('div', { class: 'note-line' },
    el('div', { class: 'field', style: 'margin:0' }, el('label', {}, 'Note ', el('span', { class: 'hint' }, '— optional')),
      el('input', { type: 'text', value: ev.note, placeholder: 'e.g. venue, reviewer notes', oninput: e => { ev.note = e.target.value; } }))));

  return el('div', { class: 'event-row' }, ...kids);
}

function clearErr(fieldId) {
  const f = $('#' + fieldId);
  if (f) { f.classList.remove('invalid'); const e = f.querySelector('.error'); if (e) e.textContent = ''; }
}
function setErr(fieldId, msg) {
  const f = $('#' + fieldId);
  if (f) { f.classList.add('invalid'); const e = f.querySelector('.error'); if (e) e.textContent = msg; }
}

function savePaper() {
  let ok = true;
  const id = (editing.id || '').toUpperCase().trim();
  editing.id = id;
  if (!isValidId(id)) { setErr('f-id', 'ID must be 2 digits then 2 capital letters, e.g. 26AB.'); ok = false; }
  else if (Store.idExists(id, editing._key)) { setErr('f-id', 'Another paper already uses this ID.'); ok = false; }
  if (!editing.title.trim()) { setErr('f-title', 'Give the paper a title.'); ok = false; }
  if (!ok) { toast('Please fix the highlighted fields.', true); return; }

  Store.upsert(editing);
  const savedId = editing.id;
  closeModal();
  App.renderAll();
  toast('Saved ' + savedId);
}

/* ============================================================
   Kanban board view — drag to change work status
   ============================================================ */

const BoardView = {
  dragKey: null,

  render() {
    const host = $('#boardHost');
    host.innerHTML = '';
    if (Store.papers.length === 0) {
      host.appendChild(el('div', { class: 'empty' },
        el('h3', {}, 'Nothing on the board'),
        el('p', {}, 'Add a paper to see it here, grouped by work status.')));
      return;
    }
    const board = el('div', { class: 'board' });
    STATUSES.forEach(s => {
      const papers = Store.papers.filter(p => p.status === s.value);
      const body = el('div', { class: 'column-body', dataset: { status: s.value } });
      papers.forEach(p => body.appendChild(this.card(p)));

      const col = el('div', { class: 'column', dataset: { status: s.value } },
        el('div', { class: 'column-head' },
          el('span', {}, el('span', { class: 'badge ' + s.cls, style: 'font-size:12px' }, el('span', { class: 'dot' }), s.label)),
          el('span', { class: 'n' }, String(papers.length))),
        body);

      col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drop-target'); });
      col.addEventListener('dragleave', () => col.classList.remove('drop-target'));
      col.addEventListener('drop', e => {
        e.preventDefault();
        col.classList.remove('drop-target');
        if (!this.dragKey) return;
        const p = Store.getByKey(this.dragKey);
        if (p && p.status !== s.value) {
          p.status = s.value;
          Store.upsert(p);
          App.renderAll();
          toast(`${p.id || 'Paper'} → ${s.label}`);
        }
        this.dragKey = null;
      });
      board.appendChild(col);
    });
    host.appendChild(board);
  },

  card(p) {
    const route = ROUTES.find(r => r.value === p.route);
    const sCls = (STATUS_MAP[p.status] || {}).cls || 'st-onhold';
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--' + sCls.replace('st-', 'st-')).trim();
    const card = el('div', {
      class: 'card', draggable: 'true',
      style: 'border-left-color:var(--' + sCls.replace('st-', 'st-') + ')',
      onclick: () => openPaperModal(p._key),
    },
      el('div', { class: 'card-top' },
        el('span', { class: 'pid' }, p.id || '—'),
        el('span', { class: 'route-tag' }, route ? route.label : '')),
      el('div', { class: 'card-title' }, p.title || 'Untitled'),
      el('div', { class: 'card-meta' },
        p.coauthors ? el('span', {}, p.coauthors) : el('span', { style: 'color:var(--ink-faint)' }, 'No coauthors'),
        p.events.length ? el('span', { style: 'font-family:var(--mono)' }, p.events.length + ' event' + (p.events.length === 1 ? '' : 's')) : null,
        (p.route === 'journal' && p.derivedFrom) ? el('span', { class: 'pid link' }, '↳ ' + p.derivedFrom) : null));

    card.addEventListener('dragstart', () => { this.dragKey = p._key; card.classList.add('dragging'); });
    card.addEventListener('dragend', () => { card.classList.remove('dragging'); this.dragKey = null; });
    return card;
  },
};

/* ===== 06-timeline.js ===== */
/* ============================================================
   Timeline view — all papers on a shared date axis
   ============================================================ */

const TimelineView = {
  mergeLinked: false,
  visible: null,        // Set of _keys shown (only papers with events)
  sortBy: 'id_early',
  sortDir: 1,
  menuOpen: false,
  sortMenuOpen: false,

  mount() {
    document.addEventListener('click', e => {
      let changed = false;
      if (this.menuOpen && !e.target.closest('.tl-paperfilter')) { this.menuOpen = false; changed = true; }
      if (this.sortMenuOpen && !e.target.closest('.tl-sort')) { this.sortMenuOpen = false; changed = true; }
      if (changed) this.renderToolbar();
    });
    this.syncFromSettings();
  },

  /* pull persisted settings into working state */
  syncFromSettings() {
    const s = Store.settings.timeline;
    this.mergeLinked = !!s.mergeLinked;
    this.sortBy = s.sortBy || 'id_early';
    this.sortDir = s.sortDir === -1 ? -1 : 1;
    this.visible = s.visibleKeys ? new Set(s.visibleKeys) : null;
  },

  save() {
    Store.updateTimelineSettings({
      mergeLinked: this.mergeLinked,
      sortBy: this.sortBy,
      sortDir: this.sortDir,
      visibleKeys: this.visible ? [...this.visible] : null,
    });
  },

  /* Papers eligible for the timeline: those with at least one dated event. */
  eligiblePapers() { return Store.papers.filter(hasEvents); },

  ensureVisible() {
    const eligibleKeys = new Set(this.eligiblePapers().map(p => p._key));
    if (this.visible === null) { this.visible = new Set(eligibleKeys); return; }
    // drop keys no longer eligible; add any newly-eligible papers as visible
    const next = new Set([...this.visible].filter(k => eligibleKeys.has(k)));
    const known = new Set(this._knownEligible || []);
    eligibleKeys.forEach(k => { if (!known.has(k)) next.add(k); });
    this._knownEligible = [...eligibleKeys];
    this.visible = next;
  },

  render() {
    this.ensureVisible();
    this.renderToolbar();
    this.renderCanvas();
  },

  renderToolbar() {
    const bar = $('#tlToolbar');
    bar.innerHTML = '';
    const eligible = this.eligiblePapers();
    if (Store.papers.length === 0) { bar.style.display = 'none'; return; }
    bar.style.display = 'flex';

    // ----- paper filter dropdown (only papers with events) -----
    const shownCount = this.visible.size;
    const filterBtn = el('button', { class: 'btn btn-sm', onclick: e => { e.stopPropagation(); this.menuOpen = !this.menuOpen; this.sortMenuOpen = false; this.renderToolbar(); } },
      `Papers: ${shownCount}/${eligible.length} ▾`);
    const filterWrap = el('div', { class: 'tl-paperfilter group' }, filterBtn);
    if (this.menuOpen) {
      const menu = el('div', { class: 'menu' });
      menu.appendChild(el('div', { class: 'menu-actions' },
        el('button', { class: 'btn btn-sm btn-ghost', onclick: () => { this.visible = new Set(eligible.map(p => p._key)); this.save(); this.render(); } }, 'All'),
        el('button', { class: 'btn btn-sm btn-ghost', onclick: () => { this.visible = new Set(); this.save(); this.render(); } }, 'None')));
      if (eligible.length === 0) {
        menu.appendChild(el('div', { style: 'padding:8px 6px;font-size:13px;color:var(--ink-faint)' }, 'No papers have dated events yet.'));
      }
      eligible.forEach(p => {
        const cb = el('input', { type: 'checkbox', checked: this.visible.has(p._key),
          onchange: e => { if (e.target.checked) this.visible.add(p._key); else this.visible.delete(p._key); this.save(); this.renderCanvas(); this.refreshFilterLabel(); } });
        menu.appendChild(el('label', {}, cb, el('span', { class: 'pid' }, p.id || '—'), el('span', {}, p.title || 'Untitled')));
      });
      filterWrap.appendChild(menu);
    }
    bar.appendChild(filterWrap);

    // ----- sort control -----
    const curSort = TL_SORTS.find(s => s.value === this.sortBy) || TL_SORTS[0];
    const dirGlyph = this.sortDir > 0 ? '↑' : '↓';
    const sortBtn = el('button', { class: 'btn btn-sm', onclick: e => { e.stopPropagation(); this.sortMenuOpen = !this.sortMenuOpen; this.menuOpen = false; this.renderToolbar(); } },
      `Sort: ${curSort.label} ${dirGlyph} ▾`);
    const sortWrap = el('div', { class: 'tl-sort group' }, sortBtn);
    if (this.sortMenuOpen) {
      const menu = el('div', { class: 'menu' });
      TL_SORTS.forEach(s => {
        const active = s.value === this.sortBy;
        menu.appendChild(el('label', { class: active ? 'active' : '' },
          el('input', { type: 'radio', name: 'tlsort', checked: active,
            onchange: () => { this.sortBy = s.value; this.save(); this.renderCanvas(); this.renderToolbar(); } }),
          el('span', {}, s.label)));
      });
      menu.appendChild(el('div', { class: 'menu-actions', style: 'border-top:1px solid var(--rule-soft);border-bottom:none;margin:6px 0 0;padding:8px 6px 2px' },
        el('button', { class: 'btn btn-sm' + (this.sortDir > 0 ? ' btn-primary' : ''), onclick: () => { this.sortDir = 1; this.save(); this.renderCanvas(); this.renderToolbar(); } }, 'Ascending ↑'),
        el('button', { class: 'btn btn-sm' + (this.sortDir < 0 ? ' btn-primary' : ''), onclick: () => { this.sortDir = -1; this.save(); this.renderCanvas(); this.renderToolbar(); } }, 'Descending ↓')));
      sortWrap.appendChild(menu);
    }
    bar.appendChild(sortWrap);

    // ----- merge linked toggle -----
    const toggle = el('label', { class: 'inline' },
      el('input', { type: 'checkbox', checked: this.mergeLinked, onchange: e => { this.mergeLinked = e.target.checked; this.save(); this.renderCanvas(); } }),
      'Merge journal papers with their source conference paper');
    bar.appendChild(el('div', { class: 'group' }, toggle));
  },

  refreshFilterLabel() {
    const btn = $('#tlToolbar .tl-paperfilter > button');
    if (btn) btn.firstChild.textContent = `Papers: ${this.visible.size}/${this.eligiblePapers().length} ▾`;
  },

  /* Build the list of lanes to draw, then sort them. */
  buildLanes() {
    const eligible = this.eligiblePapers();
    const shown = eligible.filter(p => this.visible.has(p._key));
    let lanes;
    if (!this.mergeLinked) {
      lanes = shown.map(p => ({
        id: p.id, title: p.title, status: p.status, route: p.route, derivedFrom: p.derivedFrom,
        earlyId: p.id, lateId: p.id,
        segments: this.paperSegments(p, p.id),
      }));
    } else {
      const byId = Object.fromEntries(Store.papers.map(p => [p.id, p]));
      const consumed = new Set();
      lanes = [];
      shown.forEach(p => {
        if (p.route === 'journal' && p.derivedFrom && byId[p.derivedFrom]) {
          const conf = byId[p.derivedFrom];
          consumed.add(conf._key);
          const segs = [...this.paperSegments(conf, conf.id), ...this.paperSegments(p, p.id)];
          segs.sort((a, b) => a.start - b.start);
          lanes.push({ id: `${conf.id} → ${p.id}`, title: p.title, status: p.status, route: 'journal', derivedFrom: '', merged: true,
            earlyId: conf.id, lateId: p.id, segments: segs });
        }
      });
      shown.forEach(p => {
        if (consumed.has(p._key)) return;
        if (p.route === 'journal' && p.derivedFrom && byId[p.derivedFrom]) return;
        lanes.push({ id: p.id, title: p.title, status: p.status, route: p.route, derivedFrom: p.derivedFrom,
          earlyId: p.id, lateId: p.id, segments: this.paperSegments(p, p.id) });
      });
    }
    return this.sortLanes(lanes);
  },

  sortLanes(lanes) {
    const dir = this.sortDir;
    const laneBounds = l => {
      let min = Infinity, max = -Infinity;
      l.segments.forEach(s => { min = Math.min(min, +s.start); max = Math.max(max, +s.end); });
      return [min, max];
    };
    const keyer = {
      id_early: l => l.earlyId || '',
      id_late:  l => l.lateId || '',
      first_ev: l => laneBounds(l)[0],
      last_ev:  l => laneBounds(l)[1],
    }[this.sortBy] || (l => l.earlyId);
    return lanes.slice().sort((a, b) => {
      const av = keyer(a), bv = keyer(b);
      if (av < bv) return -1 * dir;
      if (av > bv) return 1 * dir;
      return 0;
    });
  },

  /* Segments = consecutive dated events -> bars; plus a trailing "current" bar to today. */
  paperSegments(p, ownerId) {
    const evs = datedEvents(p);
    const segs = [];
    let rIndex = 0;
    for (let i = 0; i < evs.length - 1; i++) {
      const a = evs[i], b = evs[i + 1];
      let role = null, label = '';
      if (isSubmissionType(a.type) && isDecisionEventType(b.type)) {
        role = 'review'; label = 'R' + rIndex; rIndex++;
      } else if (isDecisionEventType(a.type) && isResubmitType(b.type)) {
        role = 'authors';
      }
      segs.push({ start: parseDate(a.date), end: parseDate(b.date), from: a, to: b, owner: ownerId, current: false, role, label });
    }
    if (evs.length === 1) {
      segs.push({ start: parseDate(evs[0].date), end: parseDate(evs[0].date), from: evs[0], to: evs[0], owner: ownerId, current: false, point: true, role: null });
    }
    const last = evs[evs.length - 1];
    const terminalReached = evs.some(e => isTerminalType(e.type)) || p.status === 'published';
    if (last && !terminalReached) {
      let role = null, label = '';
      if (isSubmissionType(last.type)) { role = 'review'; label = 'R' + rIndex; }
      segs.push({ start: parseDate(last.date), end: new Date(todayISO() + 'T00:00:00'), from: last, to: null, owner: ownerId, current: true, role, label });
    }
    return segs;
  },

  renderCanvas() {
    const host = $('#timelineHost');
    host.innerHTML = '';

    if (Store.papers.length === 0) {
      host.appendChild(el('div', { class: 'empty' },
        el('h3', {}, 'Nothing to plot yet'),
        el('p', {}, 'Add papers with dated publication events to see them here.')));
      return;
    }

    const lanes = this.buildLanes();
    const withDates = lanes.filter(l => l.segments.length > 0);
    if (this.eligiblePapers().length === 0) {
      host.appendChild(el('div', { class: 'empty' }, el('h3', {}, 'No dated events'),
        el('p', {}, 'Add dates to publication events to position papers on the timeline.')));
      return;
    }
    if (lanes.length === 0) {
      host.appendChild(el('div', { class: 'empty' }, el('h3', {}, 'No papers selected'), el('p', {}, 'Use the Papers filter to choose what to plot.')));
      return;
    }

    // ----- legend -----
    host.appendChild(this.legendEl());

    // ----- domain -----
    let min = Infinity, max = -Infinity;
    withDates.forEach(l => l.segments.forEach(s => { min = Math.min(min, +s.start); max = Math.max(max, +s.end); }));
    min = new Date(min); max = new Date(max);
    if (+min === +max) { min = new Date(+min - 30 * DAY); max = new Date(+max + 30 * DAY); }
    const pad = Math.max((max - min) * 0.04, 5 * DAY);
    min = new Date(+min - pad); max = new Date(+max + pad);
    const span = max - min || DAY;

    const LANE_LABEL_W = 220;
    const avail = Math.max(360, (host.clientWidth || 900) - LANE_LABEL_W - 2);
    const byDay = Math.ceil(span / DAY) * 0.35;
    const trackW = Math.max(avail, byDay);
    const totalW = LANE_LABEL_W + trackW;
    const xOf = d => ((d - min) / span) * trackW;
    const dateAt = px => new Date(+min + (px / trackW) * span);

    const inner = el('div', { class: 'tl-inner', style: `width:${totalW}px` });

    // ----- axis header (year row + month-number row) -----
    const header = el('div', { class: 'tl-header' });
    const corner = el('div', { class: 'tl-corner', style: `width:${LANE_LABEL_W}px;min-width:${LANE_LABEL_W}px` }, 'Timeline');
    const axis = el('div', { class: 'tl-axis', style: `width:${trackW}px` });
    // calendar shading behind the ticks/lanes is drawn per-lane; on the axis we
    // show year labels (top) and month numbers (bottom).
    this.yearTicks(min, max).forEach(t => {
      axis.appendChild(el('div', { class: 'tl-tick', style: `left:${xOf(t.date)}px` }, el('span', { class: 'yr' }, t.label)));
    });
    this.monthTicks(min, max, trackW).forEach(t => {
      const m = el('div', { class: 'tl-month', style: `left:${xOf(t.date)}px` }, el('span', {}, t.label));
      axis.appendChild(m);
    });
    header.appendChild(corner);
    header.appendChild(axis);
    inner.appendChild(header);

    // ----- lanes body (with calendar shading + crosshair overlay) -----
    const body = el('div', { class: 'tl-body' });

    // calendar shading layer spans the full track height behind lanes
    const shadeLayer = el('div', { class: 'tl-shade-layer', style: `left:${LANE_LABEL_W}px;width:${trackW}px` });
    this.calendarBands(min, max).forEach(band => {
      const x1 = xOf(band.start), x2 = xOf(band.end);
      shadeLayer.appendChild(el('div', {
        class: 'tl-shade',
        style: `left:${x1}px;width:${Math.max(1, x2 - x1)}px;background:${band.color}`,
        title: band.title,
      }));
    });
    body.appendChild(shadeLayer);

    // crosshair
    const crosshair = el('div', { class: 'tl-crosshair', style: `left:${LANE_LABEL_W}px` },
      el('div', { class: 'tl-crosshair-date' }));
    body.appendChild(crosshair);

    const lanesWrap = el('div', { class: 'tl-lanes' });
    lanes.forEach(l => lanesWrap.appendChild(this.laneEl(l, xOf, trackW)));
    body.appendChild(lanesWrap);

    // crosshair interactivity — track area only (right of the label column)
    lanesWrap.addEventListener('mousemove', e => {
      const rect = lanesWrap.getBoundingClientRect();
      const xInLanes = e.clientX - rect.left;      // 0 at label column start
      const xInTrack = xInLanes - LANE_LABEL_W;    // 0 at track start
      if (xInTrack < 0 || xInTrack > trackW) { crosshair.style.display = 'none'; return; }
      crosshair.style.display = 'block';
      crosshair.style.left = (LANE_LABEL_W + xInTrack) + 'px';
      const lbl = crosshair.querySelector('.tl-crosshair-date');
      lbl.textContent = fmtDate(dateAt(xInTrack).toISOString().slice(0, 10));
      // keep the floating label from overflowing the right edge
      lbl.style.transform = xInTrack > trackW - 90 ? 'translateX(-100%)' : 'translateX(0)';
    });
    lanesWrap.addEventListener('mouseleave', () => { crosshair.style.display = 'none'; });

    inner.appendChild(body);
    host.appendChild(el('div', { class: 'tl-canvas' }, inner));
  },

  legendEl() {
    return el('div', { class: 'tl-legend' },
      el('span', { class: 'lg' }, el('span', { class: 'sw review' }), el('b', {}, 'Under review'), ' (R0, R1, R2…)'),
      el('span', { class: 'lg' }, el('span', { class: 'sw authors' }), el('b', {}, 'With authors'), ' (revising)'),
      el('span', { class: 'lg' }, el('span', { class: 'sw other' }), el('b', {}, 'Other')),
      el('span', { class: 'lg' }, el('span', { class: 'sw current' }), el('b', {}, 'Ongoing'), ' (to today)'),
      Store.calendar.length ? el('span', { class: 'lg' }, el('span', { class: 'sw busy' }), el('b', {}, 'Busy'), ' / ', el('span', { class: 'sw relaxed' }), el('b', {}, 'Relaxed')) : null);
  },

  laneEl(l, xOf, trackW) {
    const label = el('div', { class: 'lane-label' },
      el('span', { class: 'pid' + (l.merged ? ' link' : '') }, l.id || '—'),
      el('span', { class: 'lt' }, l.title || 'Untitled'),
      statusBadge(l.status),
      (!l.merged && l.route === 'journal' && l.derivedFrom) ? el('span', { class: 'tl-linkflag' }, '↳ from ' + l.derivedFrom) : null);

    const track = el('div', { class: 'lane-track', style: `width:${trackW}px` });

    l.segments.forEach(s => {
      if (!s.point) {
        const x1 = xOf(s.start), x2 = xOf(s.end);
        const w = Math.max(2, x2 - x1);
        const roleCls = s.role === 'review' ? ' role-review' : s.role === 'authors' ? ' role-authors' : '';
        const seg = el('div', { class: 'tl-seg' + (s.current ? ' current' : '') + roleCls, style: `left:${x1}px;width:${w}px` });
        const days = daysBetween(s.start, s.end);
        if (w > 34 || s.current) seg.appendChild(el('div', { class: 'dur' }, s.current ? humanDuration(days) + ' · now' : humanDuration(days)));
        if (s.label && w > 22) seg.appendChild(el('div', { class: 'rlabel' }, s.label));
        track.appendChild(seg);
      }
      track.appendChild(this.nodeEl(s.from, xOf(s.start)));
    });
    const lastReal = [...l.segments].reverse().find(s => s.to && s.to !== s.from && !s.current);
    if (lastReal) track.appendChild(this.nodeEl(lastReal.to, xOf(lastReal.end)));

    return el('div', { class: 'tl-lane' }, label, track);
  },

  /* Event marker with an icon indicating its kind. */
  nodeEl(ev, x) {
    if (!ev) return document.createComment('');
    const kind = this.eventKind(ev);
    const cls = 'tl-node kind-' + kind;
    let tip = eventTypeLabel(ev.type) + ' · ' + fmtDate(ev.date);
    if (isDecisionType(ev.type) && ev.decision) tip += ' (' + ev.decision + ')';
    if (isVolIssueType(ev.type) && (ev.volume || ev.issue)) tip += ` · Vol ${ev.volume || '?'}, Iss ${ev.issue || '?'}`;
    if (ev.note) tip += ' — ' + ev.note;
    return el('div', { class: cls, style: `left:${x}px`, html: this.iconSVG(kind) },
      el('div', { class: 'node-tip' }, tip));
  },

  eventKind(ev) {
    if (isDecisionType(ev.type)) {
      if (ev.decision === 'accept') return 'accept';
      if (ev.decision === 'reject') return 'reject';
      if (ev.decision === 'revise') return 'revise';
      return 'decision';
    }
    if (isResubmitType(ev.type)) return 'resubmit';
    if (isSubmissionType(ev.type)) return 'submit';
    if (isTerminalType(ev.type)) return 'terminal';
    return 'generic';
  },

  iconSVG(kind) {
    // 20x20 icons, stroke uses currentColor set by the node's kind class
    const wrap = s => `<svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${s}</svg>`;
    switch (kind) {
      case 'submit':   return wrap('<path d="M10 15V5"/><path d="M6 9l4-4 4 4"/>');            // up arrow (send in)
      case 'resubmit': return wrap('<path d="M5 9a5 5 0 1 1 1.5 3.5"/><path d="M5 6v3h3"/>');   // circular arrow (resubmit)
      case 'accept':   return wrap('<path d="M5 10.5l3.2 3.2L15 6.5"/>');                        // check / tick
      case 'reject':   return wrap('<path d="M6 6l8 8"/><path d="M14 6l-8 8"/>');                // x cross
      case 'revise':   return wrap('<path d="M4 13.5V16h2.5L14 8.5 11.5 6 4 13.5z"/><path d="M11 6.5l2.5 2.5"/>'); // pencil (revise)
      case 'terminal': return wrap('<path d="M10 3l1.9 3.9 4.3.6-3.1 3 0.7 4.3L10 15.8 6.2 17.8l0.7-4.3-3.1-3 4.3-.6z"/>'); // star
      default:         return wrap('<circle cx="10" cy="10" r="3.2"/>');                         // dot
    }
  },

  yearTicks(min, max) {
    const ticks = [];
    // first year boundary at or after min
    let y = min.getFullYear();
    if (new Date(y, 0, 1) < min) y++;   // Jan 1 of min's year is before domain -> start next year
    // label the domain start with its own year (partial year at left edge)
    ticks.push({ date: new Date(min), label: String(min.getFullYear()) });
    for (let yr = y; ; yr++) {
      const d = new Date(yr, 0, 1);
      if (d > max) break;
      // avoid a near-duplicate right on top of the domain-start label
      if (+d - +min > 20 * DAY) ticks.push({ date: d, label: String(yr) });
    }
    return ticks;
  },

  monthTicks(min, max, trackW) {
    // approximate px per month; hide numbers if too dense
    const totalMonths = (max.getFullYear() - min.getFullYear()) * 12 + (max.getMonth() - min.getMonth()) + 1;
    const pxPerMonth = trackW / Math.max(1, totalMonths);
    const showEvery = pxPerMonth < 14 ? (pxPerMonth < 8 ? 6 : 3) : 1;
    const ticks = [];
    const d = new Date(min.getFullYear(), min.getMonth(), 1);
    while (d <= max) {
      if (d >= min) {
        const mi = d.getMonth(); // 0-11
        if (mi % showEvery === 0) ticks.push({ date: new Date(d), label: String(mi + 1) });
      }
      d.setMonth(d.getMonth() + 1);
    }
    return ticks;
  },

  /* Compute additive workload bands across the domain from overlapping periods.
     Each period contributes its numeric workload weight; we sum weights over a
     sweep of boundary points and map the running total to a colour. */
  calendarBands(min, max) {
    const periods = Store.calendar
      .map(p => ({ s: parseDate(p.start), e: parseDate(p.end), w: p.workload, name: p.name }))
      .filter(p => p.s && p.e && p.e >= p.s);
    if (!periods.length) return [];
    // clip to domain
    const lo = +min, hi = +max;
    const pts = new Set([lo, hi]);
    periods.forEach(p => { pts.add(Math.max(lo, +p.s)); pts.add(Math.min(hi, +p.e)); });
    const sorted = [...pts].filter(t => t >= lo && t <= hi).sort((a, b) => a - b);
    const bands = [];
    for (let i = 0; i < sorted.length - 1; i++) {
      const a = sorted[i], b = sorted[i + 1];
      if (b <= a) continue;
      const mid = (a + b) / 2;
      let sum = 0; const names = [];
      periods.forEach(p => { if (+p.s <= mid && mid <= +p.e) { sum += p.w; names.push(`${p.name || 'Period'} (${(WORKLOAD_MAP[p.w] || {}).label || p.w})`); } });
      if (sum === 0 && !names.length) continue;
      bands.push({ start: new Date(a), end: new Date(b), color: this.shadeColor(sum), title: `${names.join(' + ')} → net ${sum > 0 ? 'busy +' + sum : sum < 0 ? 'relaxed ' + sum : 'neutral'}` });
    }
    return bands;
  },

  /* Map a summed workload weight to an rgba shade.
     Positive (busy) → warm red tint; negative (relaxed) → cool green tint. */
  shadeColor(sum) {
    if (sum === 0) return 'transparent';
    const mag = Math.min(Math.abs(sum), 6);      // cap intensity
    const alpha = 0.06 + mag * 0.055;            // 0.06 … ~0.39
    if (sum > 0) return `rgba(163, 53, 43, ${alpha.toFixed(3)})`;   // busy (danger-ish red)
    return `rgba(47, 125, 79, ${alpha.toFixed(3)})`;                // relaxed (green)
  },
};

/* ===== 07-calendar.js ===== */
/* ============================================================
   Academic calendar — manage workload periods
   ============================================================ */

function openCalendarModal() {
  renderCalendarModal();
  document.addEventListener('keydown', calEsc);
}
function closeCalendarModal() {
  $('#modalHost').innerHTML = '';
  document.removeEventListener('keydown', calEsc);
}
function calEsc(e) { if (e.key === 'Escape') closeCalendarModal(); }

function renderCalendarModal() {
  const host = $('#modalHost');
  host.innerHTML = '';

  const listHost = el('div', { id: 'calList' });

  const body = el('div', { class: 'modal-body' },
    el('p', { style: 'margin:0 0 16px;color:var(--ink-soft);font-size:13px' },
      'Add teaching semesters, breaks, or other periods that change how much time you have for research. Overlapping periods stack: busy over busy shades darker, relaxed over busy lightens it. These appear as shaded bands behind the timeline.'),
    listHost,
    el('button', { class: 'btn btn-sm', type: 'button', onclick: () => { addPeriodRow(); } }, '+ Add period'));

  const modal = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' },
    el('div', { class: 'modal-head' },
      el('h2', {}, 'Academic calendar'),
      el('button', { class: 'close-x', 'aria-label': 'Close', onclick: closeCalendarModal }, '×')),
    body,
    el('div', { class: 'modal-foot' },
      el('div', {}, el('span', { style: 'font-size:12px;color:var(--ink-faint)' }, 'Changes save automatically.')),
      el('div', { class: 'right' },
        el('button', { class: 'btn btn-primary', type: 'button', onclick: closeCalendarModal }, 'Done'))));

  const scrim = el('div', { class: 'modal-scrim', onclick: e => { if (e.target === scrim) closeCalendarModal(); } }, modal);
  host.appendChild(scrim);
  renderPeriodList();
}

function renderPeriodList() {
  const host = $('#calList');
  if (!host) return;
  host.innerHTML = '';
  if (Store.calendar.length === 0) {
    host.appendChild(el('div', { class: 'events-empty' }, 'No periods yet. Add your first academic period below.'));
    return;
  }
  // show in date order for legibility
  const ordered = Store.calendar.slice().sort((a, b) => (a.start || '').localeCompare(b.start || ''));
  ordered.forEach(pd => host.appendChild(periodRowEl(pd)));
}

function periodRowEl(pd) {
  const nameIn = el('input', { type: 'text', value: pd.name, placeholder: 'e.g. Semester 1',
    oninput: e => { pd.name = e.target.value; Store.upsertPeriod(pd); refreshTimelineIfVisible(); } });
  const startIn = el('input', { type: 'date', value: pd.start,
    oninput: e => { pd.start = e.target.value; Store.upsertPeriod(pd); refreshTimelineIfVisible(); } });
  const endIn = el('input', { type: 'date', value: pd.end,
    oninput: e => { pd.end = e.target.value; Store.upsertPeriod(pd); refreshTimelineIfVisible(); } });
  const workSel = el('select', { oninput: e => { pd.workload = parseInt(e.target.value, 10); Store.upsertPeriod(pd); refreshTimelineIfVisible(); } },
    ...WORKLOADS.map(w => el('option', { value: w.value, selected: pd.workload === w.value }, `${w.label} (${w.value > 0 ? '+' + w.value : w.value})`)));

  const invalid = pd.start && pd.end && pd.end < pd.start;

  return el('div', { class: 'period-row' },
    el('div', { class: 'field', style: 'margin:0' }, el('label', {}, 'Period name'), nameIn),
    el('div', { class: 'field', style: 'margin:0' }, el('label', {}, 'Start'), startIn),
    el('div', { class: 'field', style: 'margin:0' }, el('label', {}, 'End'),
      endIn, invalid ? el('div', { class: 'error', style: 'min-height:0' }, 'End is before start.') : null),
    el('div', { class: 'field', style: 'margin:0' }, el('label', {}, 'Workload impact'), workSel),
    el('button', { class: 'btn btn-sm btn-danger', type: 'button', title: 'Remove period',
      onclick: () => { Store.removePeriod(pd._key); renderPeriodList(); refreshTimelineIfVisible(); } }, 'Remove'));
}

function addPeriodRow() {
  const pd = blankPeriod();
  Store.upsertPeriod(pd);
  renderPeriodList();
  refreshTimelineIfVisible();
}

function refreshTimelineIfVisible() {
  if (App.view === 'timeline') TimelineView.renderCanvas();
}

/* ===== 08-app.js ===== */
/* ============================================================
   App shell: routing, nav, bootstrap
   ============================================================ */

const App = {
  view: 'table',

  init() {
    Store.load();
    TableView.mount();
    TimelineView.mount();

    $$('#nav .nav-item').forEach(btn => btn.addEventListener('click', () => this.show(btn.dataset.view)));
    $('#btnNew').addEventListener('click', () => openPaperModal(null));
    $('#btnNew2').addEventListener('click', () => openPaperModal(null));
    $('#btnExport').addEventListener('click', exportJSON);
    $('#btnCalendar').addEventListener('click', openCalendarModal);
    $('#btnImport').addEventListener('click', () => $('#importFile').click());
    $('#importFile').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => importJSONText(reader.result);
      reader.onerror = () => toast('Could not read that file.', true);
      reader.readAsText(file);
      e.target.value = '';
    });

    document.addEventListener('keydown', e => {
      if (e.target.matches('input, textarea, select')) return;
      if (e.key === '1') this.show('table');
      else if (e.key === '2') this.show('board');
      else if (e.key === '3') this.show('timeline');
      else if (e.key.toLowerCase() === 'n') openPaperModal(null);
    });

    this.renderAll();
    this.show('table');
  },

  show(view) {
    this.view = view;
    $$('#nav .nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === view));
    ['table', 'board', 'timeline'].forEach(v => { $('#view-' + v).hidden = v !== view; });
    if (view === 'table') TableView.render();
    else if (view === 'board') BoardView.render();
    else if (view === 'timeline') TimelineView.render();
  },

  renderAll() {
    const n = Store.papers.length;
    $('#railCount').textContent = n + ' paper' + (n === 1 ? '' : 's') + ' tracked';
    if (this.view === 'table') TableView.render();
    else if (this.view === 'board') BoardView.render();
    else if (this.view === 'timeline') TimelineView.render();
  },
};

document.addEventListener('DOMContentLoaded', () => App.init());

</script>
